<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Docente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <div class="max-w-7xl mx-auto p-4 sm:p-6">
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Sistema de Registro Docente</h1>
                <p class="text-xs text-slate-500">Control de Insumos, Asistencia y Evaluaciones</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="guardarTodo()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Insumo y Bloquear
                </button>
            </div>
        </header>

        <!-- Panel de Control Principal -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Configuración e Insumos -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-1 space-y-4">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-2">Gestión de Insumos</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Estado del Insumo Actual</label>
                        <div class="flex gap-2">
                            <input type="text" id="inputLetra" placeholder="Ingrese letra 'S'" class="w-full text-xs border border-slate-300 rounded-xl px-3 py-2 uppercase text-center font-bold focus:ring-2 focus:ring-indigo-500 outline-none" oninput="validarInsumoInput(this)">
                            <button onclick="procesarInsumo()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">Activar</button>
                        </div>
                    </div>

                    <div id="seccionAsistenciaToggle" class="border-t pt-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-700">Mostrar controles de Faltas</span>
                            <button onclick="alternarAsistencia()" id="btnToggleAsistencia" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium">
                                <i class="fa-solid fa-eye-slash mr-1"></i> Ocultar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Estudiantes -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 overflow-hidden">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider border-b pb-2 mb-4">Listado de Estudiantes</h2>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b">
                                <th class="p-3 font-semibold">N°</th>
                                <th class="p-3 font-semibold">Estudiante</th>
                                <th class="p-3 font-semibold text-center">Insumo 1</th>
                                <th class="p-3 font-semibold text-center">Insumo 2</th>
                                <th class="p-3 font-semibold text-center columna-asistencia">Faltas / Asistencia</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEstudiantes" class="divide-y divide-slate-100">
                            <!-- Los renglones se cargan de forma dinámica -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let mostrarAsistencia = true;

        const estudiantes = [
            { id: 1, nombre: "Alvarado Pérez Juan", insumo1: "", insumo2: "", falta: false },
            { id: 2, nombre: "Benalcázar Gómez María", insumo1: "", insumo2: "", falta: false },
            { id: 3, nombre: "Castro Morales Carlos", insumo1: "", insumo2: "", falta: false }
        ];

        function renderizarTabla() {
            const tbody = document.getElementById("tablaEstudiantes");
            tbody.innerHTML = "";

            estudiantes.forEach((est, index) => {
                let tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50/50 transition";
                tr.innerHTML = `
                    <td class="p-3 text-slate-500">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-800">${est.nombre}</td>
                    <td class="p-3 text-center">
                        <input type="text" value="${est.insumo1}" onchange="actualizarDato(${est.id}, 'insumo1', this.value)" class="w-16 text-center border rounded-lg py-1 uppercase font-bold text-xs bg-slate-50 focus:bg-white outline-none">
                    </td>
                    <td class="p-3 text-center">
                        <input type="text" value="${est.insumo2}" ${est.insumo1 === 'S' ? '' : 'disabled'} onchange="actualizarDato(${est.id}, 'insumo2', this.value)" class="w-16 text-center border rounded-lg py-1 uppercase font-bold text-xs ${est.insumo1 === 'S' ? 'bg-slate-50 focus:bg-white' : 'bg-slate-200 opacity-50 cursor-not-allowed'} outline-none">
                    </td>
                    <td class="p-3 text-center columna-asistencia" style="display: ${mostrarAsistencia ? 'table-cell' : 'none'};">
                        <button onclick="alternarFalta(${est.id})" class="px-2 py-1 rounded text-[11px] font-semibold transition ${est.falta ? 'bg-rose-100 text-rose-700 border border-rose-300' : 'bg-emerald-100 text-emerald-700 border border-emerald-300'}">
                            ${est.falta ? '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Faltó' : '<i class="fa-solid fa-check mr-1"></i> Presente'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function validarInsumoInput(input) {
            input.value = input.value.toUpperCase();
        }

        function procesarInsumo() {
            const val = document.getElementById("inputLetra").value.trim();
            if (val === 'S') {
                estudiantes.forEach(est => {
                    if (est.insumo1 === '') est.insumo1 = 'S';
                });
                renderizarTabla();
            }
        }

        function actualizarDato(id, campo, valor) {
            const est = estudiantes.find(e => e.id === id);
            if (est) {
                est[campo] = valor.toUpperCase();
                renderizarTabla();
            }
        }

        function alternarFalta(id) {
            const est = estudiantes.find(e => e.id === id);
            if (est) {
                est.falta = !est.falta;
                renderizarTabla();
            }
        }

        function alternarAsistencia() {
            mostrarAsistencia = !mostrarAsistencia;
            const btn = document.getElementById("btnToggleAsistencia");
            if (mostrarAsistencia) {
                btn.innerHTML = `<i class="fa-solid fa-eye-slash mr-1"></i> Ocultar`;
                btn.className = "text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium";
            } else {
                btn.innerHTML = `<i class="fa-solid fa-eye mr-1"></i> Mostrar`;
                btn.className = "text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg transition font-medium";
            }
            renderizarTabla();
        }

        function guardarTodo() {
            alert("¡Insumos guardados y bloqueados correctamente!");
            renderizarTabla();
        }

        renderizarTabla();
    </script>
</body>
</html>
