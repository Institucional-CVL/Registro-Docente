<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Docente - Unidad Educativa Clemente Vallejo Larrea</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .falta-estilo {
            background-color: rgba(254, 242, 242, 0.6);
            border-left: 4px solid #ef4444;
        }
        .nota-baja {
            color: #dc2626 !important;
            border-color: #fca5a5 !important;
            background-color: #fef2f2 !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Header institucional -->
    <header class="bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-lg font-black tracking-wide uppercase">Unidad Educativa Clemente Vallejo Larrea</h1>
                <p class="text-xs text-indigo-200">Portal de Gestión Docente e Insumos</p>
            </div>
            <div class="text-xs bg-indigo-800 px-3 py-1.5 rounded-lg border border-indigo-700 font-medium">
                <i class="fa-solid fa-user-tie mr-1 text-indigo-300"></i> Prof. Iván Loma
            </div>
        </div>
    </header>

    <!-- Contenedor principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- Panel de Control y Filtros -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Curso / Paralelo</label>
                    <select id="selectCurso" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Seleccione curso...</option>
                        <option value="3ro_basica">3ro de Básica</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Insumo / Actividad</label>
                    <select id="selectInsumo" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">Seleccione insumo...</option>
                        <option value="insumo_1">Insumo 1</option>
                    </select>
                </div>
                <div class="sm:col-span-2 flex items-end gap-2">
                    <button type="button" onclick="cargarEstudiantesYNotas()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-4 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate"></i> Cargar Datos
                    </button>
                    <button type="button" onclick="guardarCambiosFirebase()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Guardar
                    </button>
                </div>
            </div>
        </section>

        <!-- Lista Dinámica de Estudiantes -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xs font-black text-gray-700 uppercase tracking-wider">Nómina de Estudiantes y Calificaciones</h2>
                <span id="contadorAsistencia" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">Asistencia: 0 / 0</span>
            </div>
            
            <div id="contenedorEstudiantes" class="divide-y divide-gray-100">
                <!-- Los estudiantes se inyectarán dinámicamente aquí -->
                <div class="p-8 text-center text-gray-400 text-sm">
                    Seleccione un curso y un insumo, luego haga clic en "Cargar Datos".
                </div>
            </div>
        </section>

    </main>

    <!-- Scripts de Lógica -->
    <script>
        // Base simulada de datos locales o estado en memoria
        let datosDelInsumo = {
            notas: {},
            asistencia: {},
            observaciones: {}
        };

        // Lista de prueba para el ejemplo
        let listaEstudiantesEjemplo = [
            "ALCIVAR PEREZ JUAN CARLOS",
            "BENITEZ GOMEZ MARIA JOSE",
            "CANDO VACA LUIS FERNANDO"
        ];

        function cargarEstudiantesYNotas() {
            const contenedor = document.getElementById('contenedorEstudiantes');
            contenedor.innerHTML = "";

            listaEstudiantesEjemplo.forEach((nombre, idx) => {
                const num = idx + 1;
                const idLimpio = nombre.replace(/\s+/g, '_');
                const notaExistente = (datosDelInsumo.notas && datosDelInsumo.notas[nombre] !== undefined) ? datosDelInsumo.notas[nombre] : "";
                const asisExistente = (datosDelInsumo.asistencia && datosDelInsumo.asistencia[nombre] !== undefined) ? datosDelInsumo.asistencia[nombre] : "A";
                const obsExistente = (datosDelInsumo.observaciones && datosDelInsumo.observaciones[nombre] !== undefined) ? datosDelInsumo.observaciones[nombre] : "";

                const esAsis = asisExistente === "A" || asisExistente === true;
                const esAtraso = asisExistente === "ATR";
                const esFalta = asisExistente === "F";
                const esNotaBaja = notaExistente !== "" && parseFloat(notaExistente) < 7;

                contenedor.innerHTML += `
                    <div id="fila_est_${idLimpio}" class="p-3 space-y-2 hover:bg-indigo-50/40 transition border-b border-gray-100 last:border-none ${esFalta ? 'falta-estilo' : ''}">
                        <div class="flex items-center justify-between gap-3">
                            <div class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer" onclick="editarNombreEstudiante('${nombre}')" title="Haz clic para editar el nombre">
                                <span class="w-6 h-6 bg-indigo-100 text-indigo-700 font-bold rounded-full flex items-center justify-center text-xs flex-shrink-0">${num}</span>
                                <span class="text-xs font-bold text-gray-800 uppercase leading-snug break-words">${nombre}</span>
                            </div>

                            <div class="flex items-center gap-1.5 overflow-x-auto py-1 flex-shrink-0" style="scrollbar-width: none; -ms-overflow-style: none;">
                                <label class="flex items-center gap-1 cursor-pointer bg-emerald-50 hover:bg-emerald-100 px-2 py-1.5 rounded-xl border border-emerald-200 transition flex-shrink-0" title="Marcar Asistencia">
                                    <input type="checkbox" id="asis_${idLimpio}" data-estudiante-asis="${nombre}" class="asistencia-input hidden" ${esAsis ? 'checked' : ''} onchange="alternarVisto(this, '${nombre}')">
                                    <i id="visto_${idLimpio}" class="fa-solid fa-circle-check text-emerald-600 text-base ${esAsis ? '' : 'hidden'}"></i>
                                    <span class="text-[10px] font-bold text-emerald-800">${esAsis ? 'Asis' : '❌ FALT'}</span>
                                </label>

                                <label class="flex items-center gap-1 cursor-pointer bg-amber-50 hover:bg-amber-100 px-2 py-1.5 rounded-xl border border-amber-200 transition flex-shrink-0" title="Marcar Atraso">
                                    <input type="checkbox" id="atraso_${idLimpio}" data-estudiante-atraso="${nombre}" class="atraso-input h-3.5 w-3.5 text-amber-600 rounded focus:ring-amber-500" ${esAtraso ? 'checked' : ''} onchange="alternarAtraso(this, '${nombre}')">
                                    <span class="text-[10px] font-bold text-amber-800">Atr</span>
                                </label>

                                <input type="number" step="0.01" min="0" max="10" placeholder="0.00" value="${notaExistente}" data-estudiante="${nombre}" oninput="validarNotaInput(this)" class="nota-input w-14 bg-gray-50 border-2 border-indigo-200 focus:border-indigo-600 focus:bg-white text-gray-900 font-bold text-center text-sm rounded-xl py-1 px-1 focus:outline-none transition flex-shrink-0 ${esNotaBaja ? 'nota-baja' : ''}">
                                
                                <button type="button" onclick="eliminarEstudiante('${nombre}')" class="text-gray-300 hover:text-rose-500 p-1 rounded-lg transition flex-shrink-0" title="Eliminar alumno">
                                    <i class="fa-solid fa-xmark text-base"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <input type="text" placeholder="📝 Observación / Novedad..." value="${obsExistente}" data-estudiante-obs="${nombre}" class="obs-input w-full bg-gray-50 border border-gray-200 focus:border-indigo-400 focus:bg-white text-gray-700 text-[11px] rounded-lg px-2.5 py-1 focus:outline-none transition">
                        </div>
                    </div>
                `;
            });
            actualizarContadorAsistenciaPantalla();
        }

        function alternarVisto(checkbox, estudiante) {
            const idLimpio = estudiante.replace(/\s+/g, '_');
            const iconoVisto = document.getElementById(`visto_${idLimpio}`);
            const checkAtraso = document.getElementById(`atraso_${idLimpio}`);
            const contenedorFila = document.getElementById(`fila_est_${idLimpio}`);
            const textoLabel = checkbox.parentElement.querySelector('span');

            if (checkbox.checked) {
                if (iconoVisto) iconoVisto.classList.remove('hidden');
                if (checkAtraso) checkAtraso.checked = false;
                if (contenedorFila) contenedorFila.classList.remove('falta-estilo');
                if (textoLabel) textoLabel.innerText = 'Asis';
            } else {
                if (iconoVisto) iconoVisto.classList.add('hidden');
                if (contenedorFila) contenedorFila.classList.add('falta-estilo');
                if (textoLabel) textoLabel.innerText = '❌ FALT';
            }
            actualizarContadorAsistenciaPantalla();
        }

        function alternarAtraso(checkbox, estudiante) {
            const idLimpio = estudiante.replace(/\s+/g, '_');
            const checkAsistencia = document.getElementById(`asis_${idLimpio}`);
            const iconoVisto = document.getElementById(`visto_${idLimpio}`);
            const contenedorFila = document.getElementById(`fila_est_${idLimpio}`);
            const textoAsisLabel = checkAsistencia ? checkAsistencia.parentElement.querySelector('span') : null;

            if (checkbox.checked) {
                if (checkAsistencia) checkAsistencia.checked = false;
                if (iconoVisto) iconoVisto.classList.add('hidden');
                if (contenedorFila) contenedorFila.classList.remove('falta-estilo');
                if (textoAsisLabel) textoAsisLabel.innerText = '❌ FALT';
            }
            actualizarContadorAsistenciaPantalla();
        }

        function validarNotaInput(input) {
            let val = parseFloat(input.value);
            if (val < 7) {
                input.classList.add('nota-baja');
            } else {
                input.classList.remove('nota-baja');
            }
        }

        function actualizarContadorAsistenciaPantalla() {
            const total = listaEstudiantesEjemplo.length;
            const asistencias = document.querySelectorAll('.asistencia-input:checked').length;
            const labelContador = document.getElementById('contadorAsistencia');
            if(labelContador) {
                labelContador.innerText = `Asistencia: ${asistencias} / ${total}`;
            }
        }

        function guardarCambiosFirebase() {
            alert("Datos preparados para sincronizar con Firebase correctamente.");
        }

        function editarNombreEstudiante(nombre) {
            // Lógica opcional para editar nombre
        }

        function eliminarEstudiante(nombre) {
            listaEstudiantesEjemplo = listaEstudiantesEjemplo.filter(e => e !== nombre);
            cargarEstudiantesYNotas();
        }
    </script>
</body>
</html>
